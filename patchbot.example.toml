# Copy to patchbot.toml. Run `patchbot config check` and `patchbot doctor`.
# Precedence: flags > supported PATCHBOT_* variables > file > embedded defaults.
# Unknown keys fail. Secrets belong in env vars, never in this file.

[defaults]
provider = "anthropic"              # name of a provider table below
mode = "fix"                        # fix, refine, investigate
refine_model = "claude-opus-5-5"     # empty uses the provider's default_model
code_model = "claude-sonnet-5-5"     # empty uses the provider's default_model
max_cost_usd = 2.0                   # one budget for refine, revisions and code
approvers = ["aryanpappu"]           # replace with GitHub logins; collaborator required
comment_on_failure = true           # short issue diagnostic; excludes cancel/auth

[limits]
max_turns = 40                      # code turns; shared run accounting still applies
refine_max_turns = 20                # turns per refinement
max_output_tokens = 8192             # maximum output reserved before each LLM call
max_total_tokens = 2000000           # whole run, including every revision
hard_max_cost_usd = 10.0             # ceiling for any per-run dollar budget
max_test_attempts = 3                # may tighten; at most 3
run_timeout = "30m"                 # active execution time; excludes waiting
cmd_timeout = "2m"                  # agent command deadline
test_timeout = "10m"               # harness test deadline
cmd_output_bytes = 8192              # maximum command output sent to the model
cmd_store_bytes = 262144             # maximum command output stored
baseline_tests = true               # test the approved base before coding
# Add your toolchain directory here when Go lives outside these directories.
# Absolute directories only. No empty items, .., data/workspace paths or
# group/world-writable ancestors (sticky bits do not exempt them). Every entry
# must exist; ancestors and symlink locations must be root/current-user owned.
# Add your existing secure Go/git directories. Child PATH uses exactly this list.
trusted_path = ["/usr/bin", "/bin"]

[approval]
local_actor = "local"               # name recorded for local CLI/UI actions
poll_interval = "60s"               # serve polls only waiting runs
ttl = "336h"                       # waiting/approval lifetime; at most 14 days
max_revisions = 5                    # may tighten; at most 5

# Opt-in sequential reviewer: read-only tools, structured verdict bound to the
# approved spec hash and the exact diff hash, after harness tests and before
# publish. Approval freezes these values on the run. A review that times out,
# refuses, is malformed, runs out of budget or still requests changes after
# max_repairs never yields an ordinary PR. It never replaces approval or tests.
[review]
enabled = false                     # off by default
model = ""                          # empty uses the run's refine model
max_repairs = 1                      # 0 or 1 coder repair cycles after request_changes
max_turns = 15                       # turns per review round
reserve_fraction = 0.15              # share of tokens, cost and time kept from coding
salvage_draft = false                # true: unreviewed draft PR instead of failing

[log]
level = "info"                      # debug, info, warn, error
format = "text"                     # text or json

[server]
addr = "127.0.0.1:8080"              # non-loopback requires PATCHBOT_UI_TOKEN
max_concurrent_runs = 2              # executing jobs
max_queued_runs = 16                 # pending jobs; excess requests return 429
vue_src = "cdn"                     # cdn or local (vendored Vue is included)

[data]
dir = "~/.patchbot"                 # private 0700 directory; SQLite is 0600

[memory]
enabled = true                      # false: runs neither retrieve nor write memory
max_entries = 12                    # entries given to one stage (observations use at most half)
max_bytes = 4096                    # rendered bytes given to one stage
max_pending = 20                    # pending model lessons per repo; excess proposals are dropped
observation_ttl = "720h"            # typed observations older than this are not retrieved

[executor]
# Where repository commands run: baseline tests, the agent's run_cmd and
# harness verification. Git (with the GitHub token) and file tools always stay
# on the host; the token never enters the container. Command IDs and the
# allowlist are identical in both modes.
kind = "local"                      # local (host processes, not a sandbox) or container
runtime = "podman"                  # podman or docker; resolved through limits.trusted_path
# Required for kind = "container": pin by digest, never a bare tag. The image
# must already be pulled (runs use --pull never). Example:
# image = "docker.io/library/golang:1.27@sha256:<64 hex digits>"
image = ""                          # default for repositories without their own image
memory = "2g"                       # --memory
cpus = "2"                          # --cpus (string; "1.5" allowed)
pids_limit = 512                     # --pids-limit; caps fork bombs
tmpfs_size = "512m"                 # size of the only writable path besides /work
network = "none"                    # only "none" is supported
user = "65532:65532"                # non-root numeric uid:gid inside the container
# Rootless podman: "keep-id" maps the host service user to `user`, so the
# bind-mounted workspace is readable and writable. Docker: leave empty.
userns = ""
# PATH inside the container; bare command names resolve against it.
path = ["/usr/local/go/bin", "/usr/local/sbin", "/usr/local/bin", "/usr/sbin", "/usr/bin", "/sbin", "/bin"]
# A command that leaves the checkout larger than this (or unreadable) fails.
workspace_max_bytes = 2147483648       # 2 GiB
# The repo's .git is always mounted read-only inside the container. Docker uses
# a private empty DOCKER_CONFIG under the data dir; select a rootless daemon
# with DOCKER_HOST (docker contexts are not used).

[github]
# How patchbot authenticates to GitHub. No credential ever goes in this file.
#   "pat": a fine-grained personal access token from $GITHUB_TOKEN, used for
#          every allowlisted repository (local/dev and the pilot).
#   "app": a GitHub App. patchbot signs a short JWT with the App private key and
#          mints a 1-hour installation token per run, narrowed to that one
#          repository's ID with contents/issues/pull_requests write and metadata
#          read. Comments come from <slug>[bot], so your own /approve counts.
#          If App auth fails, patchbot fails closed: it never falls back to a PAT.
auth = "pat"
# app_id = 123456                    # App settings -> "App ID" (a number)
# private_key_file = "/srv/patchbot/github-app.pem"
#                                    # absolute path; regular file, mode 0600 or
#                                    # stricter, owned by the patchbot user, and
#                                    # outside [data] dir and workspaces
# installation_id = 0                # optional; 0 looks it up per repository

[providers.anthropic]
kind = "anthropic"                  # anthropic, gemini, openai
base_url = ""                       # empty uses the adapter's official endpoint
api_key_env = "ANTHROPIC_API_KEY"    # variable name; never put its value here
models = ["claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5", "claude-fable-5-2"]
default_model = "claude-sonnet-5-5"   # model ID; use `patchbot models` to check
price_free = false                   # explicit true for free local providers only
# No prices are shipped. Unpriced models use only the token limit.
# All price keys are shown below. Replace the example rates before enabling.
# Rates are USD per million tokens. input/output are required, including zero.
# [providers.anthropic.prices."claude-sonnet-5-5"]
# input = 0.0                        # replace with the provider's checked rate
# output = 0.0                       # replace with the provider's checked rate
# cache_read = 0.0                   # optional; omitted uses input
# cache_write = 0.0                  # optional; omitted uses input
# checked = 2026-11-11               # date you checked the provider's price page

# Optional providers. Remove tables you do not use: doctor checks every table.
[providers.gemini]
kind = "gemini"
base_url = ""                       # official Gemini REST endpoint by default
api_key_env = "GEMINI_API_KEY"
models = []                         # fill from `patchbot models --provider gemini`
default_model = ""                  # choose before selecting this provider
price_free = false

[providers.ollama]
kind = "openai"                     # OpenAI-compatible Chat Completions
base_url = "http://localhost:11434/v1"
api_key_env = ""                    # unauthenticated local endpoint
models = ["qwen3-coder"]            # example; use a model installed locally
default_model = "qwen3-coder"
price_free = true                    # explicit zero cost; no prices table

# Only repositories in this allowlist can run. Replace this repository.
[repos."aryanpappu/demo-app"]
# Literal argv, without a shell. The agent selects an ID and cannot add args.
commands = { test = ["go", "test", "./..."], lint = ["go", "vet", "./..."] }
protected = ["migrations/"]          # extra paths denied for reads and writes
test_command = "test"              # harness command ID; inferred if named test
# Container mode only: this repository's own image (and PATH inside it)
# override [executor] image/path for this repository. Same rules: digest-pinned,
# already pulled. Needed when repositories use different toolchains, such as
# one Go and one PHP repository. Without [executor] image, every repository
# must set one.
# image = "docker.io/library/php:8.4-cli@sha256:<64 hex digits>"
# path = ["/usr/local/bin", "/usr/bin", "/bin"]

[webhook]
enabled = false
secret_env = "PATCHBOT_WEBHOOK_SECRET"
path = "/hooks/github"
trigger_labels = { "ai-refine" = "refine", "ai-fix" = "fix", "ai-investigate" = "investigate" }
# How often open issues are swept for trigger labels a missed delivery did not
# report. The first sweep of a repository records existing labels as a baseline
# and starts nothing; only labels added later start runs.
label_poll_interval = "5m"
