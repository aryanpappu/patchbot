version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - misspell
    - revive
    - gocritic
    - bodyclose
    - errorlint
    - nolintlint
    - gosec
  settings:
    revive:
      enable-default-rules: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aryanpappu/patchbot
