version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - misspell
    - revive
    - gocritic
    - bodyclose
    - errorlint
    - nolintlint
    - gosec
  settings:
    revive:
      enable-default-rules: true
  exclusions:
    rules:
      # agent.Check returns a private approval token on purpose: callers can pass it on but never build one.
      - path: internal/agent/gate\.go
        linters: [revive]
        text: unexported-return

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aryanpappu/patchbot
